<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>간단한 HTML 샘플</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        line-height: 1.6;
      }
      .card {
        max-width: 420px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      }
      button {
        margin-top: 12px;
        padding: 8px 14px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>안녕하세요 👋</h1>
      <p>이것은 아주 간단한 HTML 샘플입니다.</p>
      <button onclick="alert('버튼이 클릭되었습니다!')">클릭해보기</button>
    </div>
  </body>
</html>
